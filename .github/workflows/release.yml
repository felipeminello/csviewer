name: Release

on:
  push:
    tags:
      - "v*.*.*"

env:
  FLUTTER_VERSION: "3.47.2"

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - run: flutter pub get
      - run: flutter build macos --release
      - name: Zip app bundle
        run: |
          cd build/macos/Build/Products/Release
          ditto -c -k --sequesterRsrc --keepParent CSViewer.app CSViewer-macos.zip
      - uses: actions/upload-artifact@v4
        with:
          name: macos-build
          path: build/macos/Build/Products/Release/CSViewer-macos.zip

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - run: flutter pub get
      - run: flutter build windows --release
      - name: Zip build output
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath CSViewer-windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: CSViewer-windows.zip

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev
      - run: flutter pub get
      - run: flutter build linux --release
      - name: Zip build output
        run: |
          cd build/linux/x64/release/bundle
          zip -r ${{ github.workspace }}/CSViewer-linux.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: linux-build
          path: CSViewer-linux.zip

  release:
    needs: [build-macos, build-windows, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/macos-build/CSViewer-macos.zip
            artifacts/windows-build/CSViewer-windows.zip
            artifacts/linux-build/CSViewer-linux.zip
