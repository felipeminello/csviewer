name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number (e.g., 1.0.0); creates the tag v<version>'
        required: true

env:
  FLUTTER_VERSION: "3.47.2"

jobs:
  # A versão vem da tag (v1.2.3) ou do campo do disparo manual (1.2.3). Vale
  # para o --build-name dos três builds e para a tag da release.
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - id: version
        env:
          VERSION: ${{ inputs.version || github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          version=${VERSION#v}
          if [[ ! $version =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Versão inválida: '$VERSION' (use X.Y.Z)"
            exit 1
          fi
          # No disparo manual a tag é criada pela release; se já existir, os
          # binários iriam para uma release de outro commit.
          if [[ $GITHUB_EVENT_NAME == workflow_dispatch ]] &&
            gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v$version" --silent 2>/dev/null; then
            echo "::error::A tag v$version já existe; escolha outra versão"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build-macos:
    needs: version
    runs-on: macos-latest
    env:
      TEAM_ID: 5DJSZLRUXA
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - run: flutter pub get
      - run: flutter build macos --release --build-name=${{ needs.version.outputs.version }}
      - name: Install Developer ID certificate and API key
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          keychain=$RUNNER_TEMP/signing.keychain-db
          keychain_password=$(openssl rand -base64 24)
          printf '%s' "$MACOS_CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/certificate.p12" -P "$MACOS_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -k "$keychain_password" "$keychain"
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/certificate.p12"
          printf '%s\n' "$ASC_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
          echo "ASC_KEY_PATH=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"
      - name: Sign, notarize and zip app bundle
        run: tool/notarize.sh --zip build/macos/CSViewer-macos.zip
      - name: Remove signing keychain and API key
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
          rm -f "$RUNNER_TEMP/AuthKey.p8"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos-build
          path: build/macos/CSViewer-macos.zip
          retention-days: 1

  build-windows:
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - run: flutter pub get
      - run: flutter build windows --release --build-name=${{ needs.version.outputs.version }}
      - name: Zip build output
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath CSViewer-windows.zip
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-build
          path: CSViewer-windows.zip
          retention-days: 1

  build-linux:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev
      - run: flutter pub get
      - run: flutter build linux --release --build-name=${{ needs.version.outputs.version }}
      - name: Zip build output
        run: |
          cd build/linux/x64/release/bundle
          zip -r ${{ github.workspace }}/CSViewer-linux.zip .
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-build
          path: CSViewer-linux.zip
          retention-days: 1

  release:
    needs: [version, build-macos, build-windows, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          # No disparo manual não há tag no ref: cria v<versão> no commit buildado.
          tag_name: v${{ needs.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: |
            artifacts/macos-build/CSViewer-macos.zip
            artifacts/windows-build/CSViewer-windows.zip
            artifacts/linux-build/CSViewer-linux.zip
